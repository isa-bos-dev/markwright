name: pip-audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays, off-peak

# Least privilege: the job only reads the code. Without this block the
# GITHUB_TOKEN gets the repository's default permissions, which can include
# write access.
permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: windows-latest
    steps:
      # Actions are pinned to a full commit SHA, not a tag: a tag can be moved
      # to other code, a SHA cannot. Dependabot keeps both SHA and comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Informative, not a required check yet (see docs/specs/008-ci-cd):
      # torch/transformers pull in a large dependency tree outside our control,
      # and a permanently-red required check trains people to ignore it.
      - name: Audit installed dependencies for known vulnerabilities
        continue-on-error: true
        run: uv run --with pip-audit pip-audit
