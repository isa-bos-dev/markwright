[project]
name = "markwright"
version = "0.2.0"
description = "Local, privacy-first PDF to Markdown converter with dual CLI/GUI and bilingual interface."
authors = [
    { name = "IsaBosDev" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # Conversion engine: PDF layout, tables, headings and images.
    "docling>=2.130.0",
    # Imported directly (document model and image-reference mode); pinned so a
    # docling upgrade cannot silently drop it.
    "docling-core>=2.98.0",
    # OCR engine. Declared explicitly because `docling` does not install it (only its
    # `easyocr` extra does) and it is forced over docling's default, RapidOCR, whose
    # models are hosted on ModelScope instead of GitHub.
    "easyocr>=1.7.2",
    # Decrypts password-protected PDFs in memory: docling has no password support.
    "pypdf>=6.19.0",
    # Visual theme of the GUI.
    "sv-ttk>=2.6.1",
    # Interactive terminal menu (`markwright menu`). Already installed transitively
    # via docling; declared because it is now imported directly.
    "rich>=15.0.0",
    # ASCII-art banner for the terminal menu. Pure Python, no transitive
    # dependencies of its own — tiny next to docling/torch.
    "pyfiglet>=1.0.4",
]

[project.scripts]
markwright = "markwright.main:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    # Used by the tests and by scripts/generate_assets.py to read and build the logo images.
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Builds the Windows .exe (REL, 009-release-1-0).
    "pyinstaller>=6.22.3",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# C90 complexity, PLC0415 imports outside the file header, ARG unused arguments,
# S security checks, ANN missing type hints.
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLC0415", "ARG", "S", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Every exception below states why it exists; nothing is silenced with a bare `# noqa`.
[tool.ruff.lint.per-file-ignores]
# docling loads PyTorch (~5 s): it is imported on the first conversion so that the GUI
# window and `--help` stay instant.
"src/markwright/core/converter.py" = ["PLC0415"]
"src/markwright/core/pdf_source.py" = ["PLC0415"]
# Each mode is imported only when used (the CLI never loads tkinter), and a missing
# tkinter has to be caught at that import.
"src/markwright/main.py" = ["PLC0415"]
# Opening the folder runs `open`/`xdg-open`/`os.startfile`, found through PATH.
# Reviewed in SEC (005-security-hardening): the target is `resolve_output_paths(...)`,
# computed entirely by Markwright from the input path the user already chose via a
# trusted dialog/CLI/menu — never from the PDF's own content. False positives of
# static analysis, not a real finding.
"src/markwright/gui/main_screen.py" = ["S603", "S606", "S607"]
# Test code: `assert` is the assertion; fakes must mirror the signature of what they
# replace; the sample passwords and "/tmp" paths are not secrets or real files. Type hints
# are required in the application code, not in tests or helper scripts.
"tests/**" = ["S", "ARG", "PLC0415", "ANN"]
"scripts/**" = ["ANN"]

[tool.mypy]
files = ["src/markwright"]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The core is checked strictly. mypy only accepts `strict` globally, so the flags it
# switches on are listed here for `markwright.core` alone.
[[tool.mypy.overrides]]
module = "markwright.core.*"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that run a real docling conversion (excluded by default)",
]
# --capture=sys: pytest's default fd-level capture breaks Tcl/Tk start-up on Windows
# ("Can't find a usable init.tcl") when a second Tk interpreter is created.
addopts = "-m 'not integration' --capture=sys"

# Run with:  uv run pytest --cov      (opt-in: it makes the suite ~2.5x slower)
[tool.coverage.run]
source = ["markwright"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 95
